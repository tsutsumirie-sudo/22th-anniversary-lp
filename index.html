<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プリンシパルホーム 22周年記念 感謝イベント｜11/21(土)・22(日)・23(祝)</title>
  <meta name="description" content="注文住宅・リフォームのプリンシパルホーム 22周年記念感謝イベント。キッチンカー＆縁日＆イベント参加無料。11/21(土)・22(日)・23(祝) 10:00〜17:00 プリンシパルホーム店舗駐車場にて開催。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=M+PLUS+Rounded+1c:wght@800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=34">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>

  <!-- ===== FV ===== -->
  <section class="fv" aria-label="プリンシパルホーム 22周年記念 感謝イベント">

    <!-- --x --y --w は FVイメージ(幅1076px)上の位置と幅、--d は登場する時間 -->
    <div class="fv__stage">
      <!-- 雲＋タイトル（ズームで登場） -->
      <div class="fv-item fv-logo" style="--x:58;--y:228;--w:924;--d:1.6s">
        <h1><img src="img/タイトル＆雲.png" alt="注文住宅・リフォームのプリンシパルホーム 22周年記念 感謝イベント 11月21日(土)・22日(日)・23日(祝) open 10:00〜17:00 close"></h1>
      </div>

      <!-- 会場 -->
      <div class="fv-item fv-venue" style="--x:249;--y:888;--w:645;--d:2.3s">
        <img src="img/21stEvent-07.png" alt="">
        <p class="fv-venue__text">
          <span class="fv-venue__name"><small>会場：</small>プリンシパルホーム店舗駐車場</span>
          <span class="fv-venue__addr">東京都町田市金森3-23-11</span>
        </p>
        <span class="visually-hidden">お客様駐車場完備</span>
      </div>

      <!-- 写真（中央から1枚ずつ飛び出す） -->
      <div class="fv-item fv-pop" style="--x:810;--y:65;--w:193;--d:.3s"><img class="fv-float fv-outline" src="img/21stEvent-06.png" alt=""></div>
      <!-- サイコロの女の子は、ヨーヨーの女の子の後ろ -->
      <div class="fv-item fv-pop" style="--x:880;--y:668;--w:150;--d:.9s"><img class="fv-float fv-outline" src="img/21stEvent-03.png" alt=""></div>
      <div class="fv-item fv-pop" style="--x:736;--y:817;--w:236;--d:.6s"><img class="fv-float" src="img/21stEvent-05.png" alt=""></div>
      <div class="fv-item fv-pop" style="--x:34;--y:80;--w:439;--d:1.2s"><img class="fv-float fv-float--car" src="img/キッチンカー.png" alt=""></div>

      <!-- 家族（左から パパ → ママ → 女の子 → 男の子 の順にポンと出る） -->
      <div class="fv-item fv-bounce" style="--x:23;--y:787;--w:129;--d:2.5s"><img class="fv-outline" src="img/家族_パパ.png" alt=""></div>
      <div class="fv-item fv-bounce" style="--x:125;--y:784;--w:150;--d:2.75s"><img class="fv-outline" src="img/家族_ママ.png" alt=""></div>
      <div class="fv-item fv-bounce" style="--x:260;--y:887;--w:105;--d:3s"><img class="fv-outline" src="img/家族_女の子.png" alt=""></div>
      <div class="fv-item fv-bounce" style="--x:347;--y:927;--w:76;--d:3.25s"><img class="fv-outline" src="img/家族_男の子.png" alt=""></div>

      <!-- 参加無料ふきだし -->
      <div class="fv-item fv-balloon" style="--x:500;--y:172;--w:285;--d:2.1s">
        <img src="img/参加無料ふきだし.png" alt="公式インスタフォロー＆シェアでキッチンカー＆縁日＆イベント参加無料！">
      </div>

      <!-- 最後に中央から飛び出す：リボン（1枚の画像を3つに切り分け）・星・きらきら -->
      <div class="fv-item fv-burst fv-ribbon" style="--x:46;--y:319;--w:830;--d:3.9s;--clip:inset(28% 83% 0 0)" data-cx=".08" data-cy=".64"><img src="img/リボン.png" alt=""></div>
      <div class="fv-item fv-burst fv-ribbon" style="--x:46;--y:319;--w:830;--d:3.95s;--clip:inset(0 39% 62% 53%)" data-cx=".57" data-cy=".18"><img src="img/リボン.png" alt=""></div>
      <div class="fv-item fv-burst fv-ribbon" style="--x:46;--y:319;--w:830;--d:4s;--clip:inset(8% 0 55% 76%)" data-cx=".88" data-cy=".27"><img src="img/リボン.png" alt=""></div>

      <!-- 今年もやってまいりました！（右上に向かって飛び出す） -->
      <div class="fv-item fv-pop fv-arrow" style="--x:34;--y:1200;--w:400;--d:4.3s" data-cx=".1" data-cy=".8"><img src="img/やってまいりました.png" alt="今年もやってまいりました！"></div>

      <svg class="fv-item fv-burst" style="--x:1002;--y:312;--w:40;--d:4s" viewBox="-20 -20 40 40" aria-hidden="true"><use href="#fv-sparkle"/></svg>
      <svg class="fv-item fv-burst" style="--x:980;--y:568;--w:40;--d:4.05s" viewBox="-20 -20 40 40" aria-hidden="true"><use href="#fv-sparkle"/></svg>
      <svg class="fv-item fv-burst" style="--x:22;--y:710;--w:40;--d:4.1s" viewBox="-20 -20 40 40" aria-hidden="true"><use href="#fv-sparkle"/></svg>
      <svg class="fv-item fv-burst" style="--x:1012;--y:905;--w:40;--d:4.05s" viewBox="-20 -20 40 40" aria-hidden="true"><use href="#fv-sparkle"/></svg>
      <svg class="fv-item fv-burst" style="--x:984;--y:1040;--w:40;--d:4.15s" viewBox="-20 -20 40 40" aria-hidden="true"><use href="#fv-sparkle"/></svg>
      <svg class="fv-item fv-burst" style="--x:150;--y:1150;--w:40;--d:4.1s" viewBox="-20 -20 40 40" aria-hidden="true"><use href="#fv-sparkle"/></svg>
      <svg class="fv-item fv-burst" style="--x:90;--y:1050;--w:110;--d:4.2s" viewBox="90 1030 110 80" aria-hidden="true">
        <path d="M132 1062c18-14 38-22 60-26M136 1076c20-10 40-14 60-14M128 1050c14-16 30-26 50-34" stroke="#3a7fd0" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M120 1050l9 19 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3z" fill="#ffd400" stroke="#1f5fb8" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </div>

    <p class="fv__lead">
      株式会社 プリンシパルホームでは<br>
      創立22周年を記念して<br class="u-sp">イベントを開催いたします。<br>
      キッチンカーや縁日イベント、<br>
      モルック体験など、<br>
      すべて無料でご参加いただけます。<br>
      ぜひご来場ください！
    </p>

    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <path id="fv-sparkle" d="M0-20C2-5 5-2 20 0 5 2 2 5 0 20-2 5-5 2-20 0-5-2-2-5 0-20Z" fill="#fff"/>
    </svg>
  </section>

  <!-- ===== イベント内容 ===== -->
  <section class="event" aria-labelledby="event-title">
    <h2 class="ribbon-title" id="event-title">
      <svg viewBox="0 0 330 60" aria-hidden="true" preserveAspectRatio="none">
        <path d="M0 0H330L314 30 330 60H0L16 30Z" fill="#0070bc"/>
        <path d="M27 0 43 30 27 60M303 0 287 30 303 60" fill="none" stroke="#bfe3f7" stroke-width="2.5"/>
      </svg>
      <span>イベント内容</span>
    </h2>

    <!-- キッチンカー -->
    <article class="kc" aria-label="毎日違う味が楽しめる！キッチンカー">
      <div class="kc__head">
        <h3 class="kc__title"><img src="img/違う味.png" alt="毎日違う味が楽しめる！キッチンカー"></h3>
        <img class="kc__family" src="img/家族イラスト.png" alt="">
        <img class="kc__car" src="img/キッチンカー.png" alt="">
      </div>

      <div class="kc-days">
        <div class="kc-day kc-day--1">
          <div class="kc-day__body">
            <h4 class="kc-day__badge"><img src="assets/img/day1.png" alt="1日目 焼きそば・たこ焼き"></h4>
            <div class="kc-photo kc-photo--yakisoba"><img src="img/焼きそば写真.png" alt="焼きそば"></div>
            <img class="kc-day__sub" src="img/たこ焼き.png" alt="">
            <div class="kc-photo kc-photo--takoyaki"><img src="img/たこ焼き写真.png" alt="たこ焼き"></div>
          </div>
          <p class="kc-day__shop">ROOP1</p>
        </div>

        <div class="kc-day kc-day--2">
          <div class="kc-day__body">
            <h4 class="kc-day__badge"><img src="assets/img/day2.png" alt="2日目 ワッフル"></h4>
            <div class="kc-photo kc-photo--waffle"><img src="img/ワッフル写真.png" alt="ワッフル"></div>
          </div>
          <p class="kc-day__shop">ALF KITCHEN</p>
        </div>

        <div class="kc-day kc-day--3">
          <div class="kc-day__body">
            <h4 class="kc-day__badge"><img src="assets/img/day3.png" alt="3日目 生ドーナツ"></h4>
            <div class="kc-photo kc-photo--donut"><img src="img/生ドーナツ写真.png" alt="生ドーナツ"></div>
          </div>
          <p class="kc-day__shop">&amp; me...</p>
        </div>

      </div>

      <p class="kc__note">※写真はイメージです</p>
    </article>
  </section>

  <!-- ===== モルック体験・縁日 ===== -->
  <section class="play" aria-label="モルック体験・縁日">
    <!-- モルック体験（カード全体が1枚の画像） -->
    <article class="mkcard">
      <img class="mkcard__balloon" src="img/プレゼントふきだし.png" alt="挑戦ファミリーには『オリジナル Family Photo』プレゼント♪">
      <h3 class="visually-hidden">親子であそぼう！モルック体験</h3>
      <img class="mkcard__img" src="img/モルック体験.png" alt="小さなお子さまもたのしめます♪ モルックは木製のピンをたおして点数を競う遊びです。">

      <!-- iPad以上：横長レイアウトの画像 -->
      <img class="mkcard__wide" src="img/モルック体験_ipad版.png" alt="">
    </article>

    <!-- 縁日（昨年のカードの中身を使用） -->
    <div class="play__ennichi">
      <article class="pcard">
        <div class="pcard__inner">
          <div class="en" style="--ar:559/567">
            <h3><img src="assets/img/saikoro.png" alt="サイコロチャレンジ！"></h3>
            <p class="en__text" style="--x:6.1%;--y:80%">サイコロをふって<br>景品をゲットしよう！</p>
          </div>
        </div>
      </article>

      <article class="pcard">
        <div class="pcard__inner">
          <div class="en" style="--ar:565/575">
            <h3><img src="assets/img/shateki.png" alt="射的遊び"></h3>
            <p class="en__text" style="--x:13.6%;--y:79.5%">ねらいを定めて<br>景品をゲット！</p>
          </div>
        </div>
      </article>

      <article class="pcard">
        <div class="pcard__inner">
          <div class="en" style="--ar:559/571">
            <h3><img src="assets/img/yoyo.png" alt="ヨーヨー釣り"></h3>
            <p class="en__text en__text--yoyo" style="--x:63.3%;--y:31%">上手に<br>釣れるかな？</p>
          </div>
        </div>
      </article>
    </div>
  </section>

  <!-- ===== 住まいの相談会・会場案内 ===== -->
  <section class="info" aria-label="住まいの相談会・会場案内">
    <div class="info__inner">
      <!-- 住まいの相談会（文章だけ文字で重ねる） -->
      <article class="soudan">
        <img src="img/住まいのお困りごと.png" alt="住まいのお困りごと相談会　屋根・外壁／ガス給湯器／防犯シャッター／ストレージBOX　住まいに関するお悩みはお気軽にご相談ください。">
      </article>

      <!-- 地図・会場案内 -->
      <div class="access">
        <img class="access__map" src="img/21stEvent-21.png" alt="会場地図：プリンシパルホーム（JR成瀬駅の南西、町田街道沿い・南中学校そば）">
        <p class="access__addr">会場：東京都町田市金森3-23-11</p>
        <p class="access__parking">お客様駐車場完備</p>
      </div>
    </div>
  </section>

  <!-- ===== フッター ===== -->
  <footer class="footer">
    <img class="footer__logo" src="img/logo.png" alt="PRINCIPAL HOME">
  </footer>

  <script src="js/main.js?v=5"></script>
</body>
</html>
